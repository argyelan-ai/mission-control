category: ai
name: Mission Control
version: "0.2.0"
tagline: Coding agents on your own models, with approval gates
description: >-
  Mission Control is a self-hosted home base for coding agents on your
  own models — task boards, approval gates, a knowledge vault, token and
  cost insights, and runtimes for Claude Code, vLLM, LM Studio and any
  OpenAI-compatible API.


  A first-run wizard walks you through creating the admin account and
  connecting an LLM provider. The catalog deployment runs the core stack;
  agents you steer from the phone chat, and host-level extras, need the
  full install — see the project README.
