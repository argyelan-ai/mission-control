# Roter Faden: config for the coherence tool `kz` (kohaerenz).
# Stage 1: inventory adapters + product map + rule register, ratcheted against
# docs/produkt/luecken-basis.json. See docs/produkt/README.md.
version: 1
stufe: 1
tool_version: 0.1.0
typ: fastapi
main_branch: origin/main
adapters:
  - {name: nextjs-app, app_dir: frontend-v2/src/app, src_dirs: [frontend-v2/src]}
  # openapi.json is generated by backend/scripts/export_openapi.py (private
  # overlay verticals are left out there). kz v0.1.0 has no exclude option, so
  # a checkout WITH the private overlay (frontend-v2/src/app/news, /content)
  # sees two extra routes; heads' worktrees and CI never have the overlay.
  - {name: fastapi, openapi: backend/openapi.json, model_dirs: [backend/app/models]}
entry_docs: [AGENTS.md, CLAUDE.md]
# Private overlay, gitignored on purpose (AGENTS.md says "if it exists").
links_ignore: [CLAUDE.local.md]
