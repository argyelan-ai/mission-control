<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="430" rx="14" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="14" fill="none" stroke="#232323"/>

  <!-- hub: Mission Control -->
  <g transform="translate(420,28)">
    <rect width="360" height="96" rx="10" fill="#0D0D0D" stroke="#0FA3A3"/>
    <text x="180" y="32" fill="#0FA3A3" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">MISSION CONTROL</text>
    <text x="180" y="58" fill="#F5F5F5" font-size="17" font-weight="600" text-anchor="middle">One board. One team.</text>
    <text x="180" y="80" fill="#B8B8B8" font-size="13" text-anchor="middle">Any brain per agent — mixed in one fleet</text>
  </g>

  <!-- connectors hub -> agents -->
  <g stroke="#0FA3A3" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M600 124 C 600 160, 140 150, 140 190"/>
    <path d="M600 124 C 600 164, 370 156, 370 190"/>
    <path d="M600 124 v 66"/>
    <path d="M600 124 C 600 164, 830 156, 830 190"/>
    <path d="M600 124 C 600 160, 1060 150, 1060 190"/>
  </g>

  <!-- agent cards -->
  <!-- Atlas / Claude Code -->
  <g transform="translate(32,190)">
    <rect width="216" height="168" rx="10" fill="#0D0D0D" stroke="#232323"/>
    <circle cx="34" cy="38" r="16" fill="#161616" stroke="#0FA3A3"/>
    <text x="34" y="44" font-size="15" text-anchor="middle">🧭</text>
    <text x="60" y="34" fill="#F5F5F5" font-size="15" font-weight="600">Atlas</text>
    <text x="60" y="52" fill="#6E6E6E" font-size="11">Lead — plans &amp; dispatches</text>
    <rect x="16" y="72" width="184" height="30" rx="6" fill="#161616" stroke="#2A2A2A"/>
    <text x="28" y="92" fill="#F5F5F5" font-size="12" font-weight="600">✳ Claude Code</text>
    <text x="16" y="124" fill="#B8B8B8" font-size="11" font-family="ui-monospace, monospace">runtime: anthropic-claude</text>
    <text x="16" y="142" fill="#6E6E6E" font-size="11">your Pro/Max plan — no API key</text>
  </g>

  <!-- Nova / vLLM -->
  <g transform="translate(262,190)">
    <rect width="216" height="168" rx="10" fill="#0D0D0D" stroke="#232323"/>
    <circle cx="34" cy="38" r="16" fill="#161616" stroke="#0FA3A3"/>
    <text x="34" y="44" font-size="15" text-anchor="middle">⚡</text>
    <text x="60" y="34" fill="#F5F5F5" font-size="15" font-weight="600">Nova</text>
    <text x="60" y="52" fill="#6E6E6E" font-size="11">Builder — feature work</text>
    <rect x="16" y="72" width="184" height="30" rx="6" fill="#161616" stroke="#2A2A2A"/>
    <text x="28" y="92" fill="#F5F5F5" font-size="12" font-weight="600">🚀 vLLM</text>
    <text x="16" y="124" fill="#B8B8B8" font-size="11" font-family="ui-monospace, monospace">runtime: your-gpu-box</text>
    <text x="16" y="142" fill="#6E6E6E" font-size="11">self-hosted, SSH-managed</text>
  </g>

  <!-- Bolt / LM Studio -->
  <g transform="translate(492,190)">
    <rect width="216" height="168" rx="10" fill="#0D0D0D" stroke="#232323"/>
    <circle cx="34" cy="38" r="16" fill="#161616" stroke="#0FA3A3"/>
    <text x="34" y="44" font-size="15" text-anchor="middle">🔧</text>
    <text x="60" y="34" fill="#F5F5F5" font-size="15" font-weight="600">Bolt</text>
    <text x="60" y="52" fill="#6E6E6E" font-size="11">Builder — infra &amp; perf</text>
    <rect x="16" y="72" width="184" height="30" rx="6" fill="#161616" stroke="#2A2A2A"/>
    <text x="28" y="92" fill="#F5F5F5" font-size="12" font-weight="600">🖥 LM Studio</text>
    <text x="16" y="124" fill="#B8B8B8" font-size="11" font-family="ui-monospace, monospace">runtime: your-desktop</text>
    <text x="16" y="142" fill="#6E6E6E" font-size="11">local models, lms-managed</text>
  </g>

  <!-- Vega / Ollama -->
  <g transform="translate(722,190)">
    <rect width="216" height="168" rx="10" fill="#0D0D0D" stroke="#232323"/>
    <circle cx="34" cy="38" r="16" fill="#161616" stroke="#0FA3A3"/>
    <text x="34" y="44" font-size="15" text-anchor="middle">🔍</text>
    <text x="60" y="34" fill="#F5F5F5" font-size="15" font-weight="600">Vega</text>
    <text x="60" y="52" fill="#6E6E6E" font-size="11">Reviewer — gates merges</text>
    <rect x="16" y="72" width="184" height="30" rx="6" fill="#161616" stroke="#2A2A2A"/>
    <text x="28" y="92" fill="#F5F5F5" font-size="12" font-weight="600">🦙 Ollama</text>
    <text x="16" y="124" fill="#B8B8B8" font-size="11" font-family="ui-monospace, monospace">runtime: ollama-cloud</text>
    <text x="16" y="142" fill="#6E6E6E" font-size="11">or any hosted endpoint</text>
  </g>

  <!-- Scout / any OpenAI-compatible -->
  <g transform="translate(952,190)">
    <rect width="216" height="168" rx="10" fill="#0D0D0D" stroke="#232323"/>
    <circle cx="34" cy="38" r="16" fill="#161616" stroke="#0FA3A3"/>
    <text x="34" y="44" font-size="15" text-anchor="middle">📡</text>
    <text x="60" y="34" fill="#F5F5F5" font-size="15" font-weight="600">Scout</text>
    <text x="60" y="52" fill="#6E6E6E" font-size="11">Researcher — fills the vault</text>
    <rect x="16" y="72" width="184" height="30" rx="6" fill="#161616" stroke="#2A2A2A"/>
    <text x="28" y="92" fill="#F5F5F5" font-size="12" font-weight="600">🔌 any /v1 endpoint</text>
    <text x="16" y="124" fill="#B8B8B8" font-size="11" font-family="ui-monospace, monospace">runtime: openai-compatible</text>
    <text x="16" y="142" fill="#6E6E6E" font-size="11">bring whatever speaks /v1</text>
  </g>

  <!-- tagline -->
  <text x="600" y="398" fill="#B8B8B8" font-size="13" text-anchor="middle">Switch any agent between runtimes in one click — health-checked, with automatic rollback.</text>
</svg>
