<svg xmlns="http://www.w3.org/2000/svg" width="860" height="530" viewBox="0 0 860 530" role="img" aria-labelledby="t" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="t">Installing Mission Control with one command</title>
  <defs>
    <style>
      .line { font-size: 13.5px; opacity: 0; }
      .dim  { fill: #B3B3B3; }
      .ok   { fill: #68BC76; }
      .acc  { fill: #EBE8DE; }
      .txt  { fill: #F2F2F2; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <!-- window -->
  <rect width="860" height="530" rx="14" fill="#181818"/>
  <rect x="0.5" y="0.5" width="859" height="529" rx="14" fill="none" stroke="rgba(168,168,168,0.16)"/>
  <circle cx="24" cy="22" r="5.5" fill="#3A3A3A"/>
  <circle cx="42" cy="22" r="5.5" fill="#3A3A3A"/>
  <circle cx="60" cy="22" r="5.5" fill="#3A3A3A"/>
  <text x="430" y="27" fill="#B3B3B3" font-size="12" text-anchor="middle">mission control — install</text>
  <line x1="0" y1="42" x2="860" y2="42" stroke="rgba(168,168,168,0.16)"/>

  <!-- prompt + typed command -->
  <text x="24" y="76" class="acc" font-size="13.5">$</text>
  <text x="42" y="76" class="txt" font-size="13.5">curl -fsSL https://raw.githubusercontent.com/argyelan-ai/mission-control/main/install.sh | bash
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.01;0.06" dur="18s" repeatCount="indefinite"/>
  </text>

  <g>
    <text x="24" y="112" class="line acc bold">🚀 Mission Control installer
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.12;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="138" class="line ok">✓ prerequisites ok (git, docker, compose v2, openssl)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.13;0.15;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="164" class="line dim">Install directory [./mission-control]:
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.18;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="190" class="line acc">→ cloning into ./mission-control ...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.22;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="216" class="line ok">✅ .env created with generated secrets
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="242" class="line dim">Your name (how agents address you) [Operator]: <tspan class="txt">Sam</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.31;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="268" class="line dim">GitHub user/org for MC-created repos (empty = skip) []:
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.35;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="294" class="line acc">→ using prebuilt images, starting the stack ...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.39;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="320" class="line acc">→ waiting for the API (migrations run inside the backend on start) ...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.52;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="360" class="line ok bold">✅ Mission Control is running!
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.64;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="396" class="line txt">  1. Open http://localhost and register the first admin user.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.68;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="422" class="line txt">  2. Recommended: make backup-schedule  (daily 03:00 backup of DB + data)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.69;0.71;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="448" class="line txt">  3. Optional: python3 scripts/demo-seed.py  (populates a demo board)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.74;0.97;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="24" y="474" class="line txt">  4. First agent: docs/setup/first-agent.md
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.97;1" dur="18s" repeatCount="indefinite"/></text>
  </g>

  <!-- blinking cursor -->
  <rect x="24" y="506" width="9" height="16" fill="#EBE8DE">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
