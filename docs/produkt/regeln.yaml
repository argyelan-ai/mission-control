# Rule register (Roter Faden). Written by hand, read by `kz`. See README.md here.
# Every active rule names an existing guard test (`path::test_name`); a rule
# without one is a `wish`. Code anchors: `# rule: R-... - why`.
rules:
  - id: R-one-migration-head
    says: "Alembic has exactly one head; a new migration checks for a colliding revision first."
    source: "AGENTS.md (rules that bite)"
    owner: backend/alembic/versions/
    applies_to: ["backend/alembic/**"]
    enforced_by:
      - {test: "backend/tests/test_alembic_chain_integrity.py::test_exactly_one_head"}
      - {test: "backend/tests/test_alembic_chain_integrity.py::test_every_parent_exists"}
    status: active
    checked: 2026-09-26

  - id: R-privacy-scan
    says: "No new private names in the public tree; the scan runs green against its baseline."
    source: "AGENTS.md (public repository); CI leak gate"
    owner: scripts/privacy-scan.py
    applies_to: ["**"]
    enforced_by:
      - {test: "backend/tests/test_privacy_scan.py::test_this_repository_is_green_right_now"}
      - {test: "backend/tests/test_privacy_scan.py::test_a_new_occurrence_turns_it_red"}
    status: active
    checked: 2026-09-26

  - id: R-paused-no-dispatch
    says: "A paused agent receives no push dispatch: check_dispatch_allowed refuses it, and a card assigned to it stays in its inbox, still assigned. Its own poll is R-paused-poll-takes-assigned."
    source: "ADR-085 section 5 (quiet mode); ADR-089 Nachtrag 2026-10-20 (b), (e)"
    owner: backend/app/services/operations.py
    applies_to: ["backend/app/services/operations.py", "backend/app/services/task_runner.py"]
    enforced_by:
      - {test: "backend/tests/test_operations.py::test_check_dispatch_agent_paused"}
      - {test: "backend/tests/test_paused_agent_poll_claim.py::test_paused_agent_gets_its_assigned_card_by_poll_after_push_refused"}
    status: active
    checked: 2026-10-20

  - id: R-paused-poll-takes-assigned
    says: "The agent poll does not read operational_mode: a paused agent whose poller runs still claims a card assigned to it by name, never an unassigned or foreign one; the undispatched-card watcher prepares such a card."
    source: "ADR-089 Nachtrag 2026-10-20 (b), (c), (e)"
    owner: backend/app/routers/agents.py
    applies_to: ["backend/app/routers/agents.py", "backend/app/services/watchdog/task_monitor.py"]
    enforced_by:
      - {test: "backend/tests/test_paused_agent_poll_claim.py::test_paused_agent_gets_its_assigned_card_by_poll_after_push_refused"}
      - {test: "backend/tests/test_paused_agent_poll_claim.py::test_paused_agent_poll_takes_only_cards_assigned_to_it"}
      - {test: "backend/tests/test_paused_agent_poll_claim.py::test_undispatched_watcher_prepares_assigned_card_of_paused_agent"}
    status: active
    checked: 2026-10-20

  - id: R-system-mode-holds-poll
    says: "The system mode holds a card on every path that hands one out, not only push dispatch: the agent poll, the undispatched-card watcher and pull dispatch ask the same rule (HALTED holds every card, DRAINING every card but the continuation flows). A card the poll already delivered and that waits for its ACK keeps its answer. The ACK and pending ladders and the silent-mailbox alarm wait while a card is held and for one ACK timeout after the hold. Agent rules (paused) are not part of it."
    source: "ADR-089 Nachtrag 2026-10-20, the system mode holds every path that hands a card out"
    owner: backend/app/services/operations.py
    applies_to: ["backend/app/services/operations.py", "backend/app/routers/agents.py", "backend/app/routers/agent_task_status.py", "backend/app/services/task_runner.py", "backend/app/services/watchdog/task_monitor.py"]
    enforced_by:
      - {test: "backend/tests/test_poll_respects_system_halt.py::test_halted_poll_hands_out_no_fresh_inbox_card"}
      - {test: "backend/tests/test_poll_respects_system_halt.py::test_poll_and_push_dispatch_decide_the_system_mode_alike"}
      - {test: "backend/tests/test_poll_respects_system_halt.py::test_a_card_already_delivered_keeps_its_answer_while_held"}
      - {test: "backend/tests/test_system_mode_holds_every_path.py::test_watcher_does_not_prepare_a_card_the_system_holds"}
      - {test: "backend/tests/test_system_mode_holds_every_path.py::test_ack_ladder_waits_while_the_system_holds_the_card"}
      - {test: "backend/tests/test_system_mode_holds_every_path.py::test_silent_mailbox_does_not_report_a_card_the_system_holds"}
      - {test: "backend/tests/test_system_mode_holds_every_path.py::test_pull_dispatch_claims_nothing_while_halted"}
    status: active
    checked: 2026-10-20

  - id: R-local-first-default
    says: "The head launcher pre-selects a local pair and never falls back to a cloud pair on its own."
    source: "ADR-086 decision 3"
    owner: backend/app/services/heads/
    applies_to: ["backend/app/services/heads/**"]
    enforced_by:
      - {test: "backend/tests/test_heads_pairs.py::test_default_is_local_omp"}
      - {test: "backend/tests/test_heads_pairs.py::test_no_live_engine_keeps_local_default_never_cloud"}
      - {test: "backend/tests/test_heads_pairs.py::test_default_never_falls_back_to_a_startable_cloud_pair"}
    status: active
    checked: 2026-09-26

  - id: R-design-ratchet
    says: "No new free pixel values, off-scale spacing or inline colours in frontend-v2/src; improvements are locked in."
    source: "AGENTS.md (anything visible in frontend-v2); DESIGN.md"
    owner: frontend-v2/scripts/design/ratchet.mjs
    applies_to: ["frontend-v2/src/**"]
    enforced_by:
      - {test: "frontend-v2/scripts/design/__tests__/ratchet.test.mjs::design ratchet — this repository"}
    status: active
    checked: 2026-09-26

  # From ADRs 050-058 (night rule-register run, reviewed 2026-10-01).
  - id: R-task-repo-rules-precedence
    says: "Rule injection resolves the repo as task repo (explicit) > project repo; an explicit task repo without rules does not inherit the project rules."
    source: "ADR-052 decision (precedence rule)"
    owner: backend/app/services/repo_registry.py
    applies_to: ["backend/app/services/repo_registry.py"]
    enforced_by:
      - {test: "backend/tests/test_task_repo_select.py::test_task_repo_rules_beat_project_rules"}
      - {test: "backend/tests/test_task_repo_select.py::test_explicit_task_repo_without_rules_blocks_project_fallback"}
    status: active
    checked: 2026-10-01

  - id: R-drift-two-probes
    says: "The runtime watcher commits a model-drift only after two consecutive identical probes and never touches the row on an unreachable engine."
    source: "ADR-054 decision (points 3 and 5)"
    owner: backend/app/services/runtime_watcher.py
    applies_to: ["backend/app/services/runtime_watcher.py"]
    enforced_by:
      - {test: "backend/tests/test_runtime_watcher.py::test_drift_requires_two_consecutive_probes"}
      - {test: "backend/tests/test_runtime_watcher.py::test_unreachable_engine_never_touches_row"}
    status: active
    checked: 2026-10-01

  - id: R-switch-no-pingpong
    says: "The watcher's auto-recovery never undoes an operator's recipe switch: it skips a runtime a start stopped on purpose (eviction marker, lifted by the next start of that runtime) and never revives onto a box where an exclusive sibling's anchor runs."
    source: "Recipe-switch live test 2026-10-01 (vLLM/TensorFold flip); ADR-059"
    owner: backend/app/services/runtime_watcher.py
    applies_to: ["backend/app/services/runtime_watcher.py", "backend/app/services/runtime_grace.py"]
    enforced_by:
      - {test: "backend/tests/test_recipe_switch_followups.py::test_a_loading_engine_without_any_marker_is_never_evicted_by_autostart"}
      - {test: "backend/tests/test_recipe_switch_followups.py::test_a_runtime_stopped_by_a_switch_is_not_revived"}
      - {test: "backend/tests/test_recipe_switch_followups.py::test_an_empty_box_without_a_switch_is_still_revived"}
    status: active
    checked: 2026-10-01

  - id: R-harness-compat-matrix
    says: "Harness and provider are separate axes; HARNESS_PROTOCOLS in harness_compat is the single compatibility matrix (claude to anthropic, openclaude/omp to openai) and the runtime switch refuses an incompatible pairing."
    source: "ADR-056 decision (points 2 and 4)"
    owner: backend/app/services/harness_compat.py
    applies_to: ["backend/app/services/harness_compat.py", "backend/app/services/compose_renderer.py", "backend/app/services/agent_runtime_switch.py", "backend/app/routers/internal.py"]
    enforced_by:
      - {test: "backend/tests/test_harness_compat.py::test_matrix_v1"}
      - {test: "backend/tests/test_agent_harness_switch.py::test_incompatible_harness_raises"}
    status: active
    checked: 2026-10-01

  - id: R-github-vault-before-env
    says: "GitHub owner and token resolve through one central resolver (services/github_config.py) with Vault before Env."
    source: "ADR-055 decision"
    owner: backend/app/services/github_config.py
    applies_to: ["backend/app/services/github_config.py"]
    enforced_by:
      - {test: "backend/tests/test_github_config.py::test_resolver_vault_wins_over_env"}
    status: active
    checked: 2026-10-01

  - id: R-one-active-loop-per-board
    says: "At most one active loop per board; starting a second one is rejected with 409."
    source: "ADR-051 mechanics (guard rails)"
    owner: backend/app/routers/loops.py
    applies_to: ["backend/app/routers/loops.py", "backend/app/services/loop_runner.py"]
    enforced_by:
      - {test: "backend/tests/test_loops_l1.py::test_one_active_loop_per_board"}
    status: active
    checked: 2026-10-01


  # From ADRs 060-069 (night rule-register run, reviewed 2026-10-01).
  - id: R-grok-tui-no-print-mode
    says: "The grok bridge launches grok as a persistent interactive TUI; its print mode (-p / --prompt-file / streaming-json) is never launched."
    source: "ADR-068 section 1 (supersedes ADR-066 section 1); ADR-086 later narrowed the general print-mode ban to Claude heads"
    owner: scripts/grok-bridge.py
    applies_to: ["scripts/grok-bridge.py"]
    enforced_by:
      - {test: "backend/tests/test_grok_bridge.py::test_grok_launch_cmd_is_interactive_never_headless"}
      - {test: "backend/tests/test_grok_bridge.py::test_source_binds_localhost_and_uses_paste_model"}
    status: active
    checked: 2026-10-01

  - id: R-vault-token-slug-keys
    says: "Agent token vault keys derive from the stable slug (mc_token_{slug}), never from the agent name."
    source: "ADR-069 decision"
    owner: backend/app/services/secrets_helper.py
    applies_to: ["backend/app/services/secrets_helper.py", "backend/app/routers/internal.py", "backend/app/services/vault_key_migration.py"]
    enforced_by:
      - {test: "backend/tests/test_agent_token_vault.py::test_writer_keys_token_on_slug_not_name"}
      - {test: "backend/tests/test_agent_token_vault.py::test_bootstrap_reads_multiword_token_via_slug"}
      - {test: "backend/tests/test_agent_token_vault.py::test_delete_agent_removes_vault_secret_after_rename"}
    status: active
    checked: 2026-10-01

  - id: R-host-model-sync-keeps-token
    says: "A host agent model sync overwrites only the model env keys and never regenerates or drops the agent auth token."
    source: "ADR-064 section 1 (sync_host_agent_model)"
    owner: backend/app/services/host_harness_adapter.py
    applies_to: ["backend/app/services/host_harness_adapter.py"]
    enforced_by:
      - {test: "backend/tests/test_host_harness_adapter.py::test_sync_host_agent_model_preserves_token"}
      - {test: "backend/tests/test_host_harness_adapter.py::test_sync_host_agent_model_token_stable_across_repeated_syncs"}
    status: active
    checked: 2026-10-01

  - id: R-tui-reset-only-on-task-switch
    says: "A persistent TUI bridge resets its session only on a real task switch (new task_id); a revision or re-dispatch of the same task keeps the agent's working context."
    source: "ADR-068 addendum 2026-07-12 (dispatch = new task means fresh context)"
    owner: scripts/grok-bridge.py
    applies_to: ["scripts/grok-bridge.py", "scripts/hermes-bridge.py"]
    enforced_by:
      - {test: "backend/tests/test_grok_bridge.py::test_should_reset_session_decision_table"}
      - {test: "backend/tests/test_grok_bridge.py::test_dispatch_task_resets_session_on_task_switch"}
      - {test: "backend/tests/test_grok_bridge.py::test_dispatch_task_no_reset_on_same_task_revision"}
      - {test: "backend/tests/test_hermes_bridge.py::test_poll_loop_no_reset_on_same_task_redelivery"}
    status: active
    checked: 2026-10-01

  - id: R-parentless-dispatch-gated
    says: "A parentless task assigned to another agent by a non-board-lead creator (e.g. dispatch_to_agent) is classified as an executable work item, so the full pre-dispatch gating applies."
    source: "ADR-062 section on security (dispatch_to_agent gating fix)"
    owner: backend/app/services/dispatch_gating.py
    applies_to: ["backend/app/services/dispatch_gating.py", "backend/app/services/agent_task_status.py"]
    enforced_by:
      - {test: "backend/tests/test_dispatch_gating.py::test_iewi_jarvis_root_foreign_assignment_now_gated"}
      - {test: "backend/tests/test_dispatch_gating.py::test_iewi_board_lead_root_delegation_stays_ungated"}
    status: active
    checked: 2026-10-01


  # From ADRs 070-079 (night rule-register run, reviewed 2026-10-01).
  - id: R-transcript-privacy-fails-closed
    says: "Session-transcript access is fail-closed: the lead agent's transcripts (the operator's personal CLI directory) are gated to its slugs plus the attribution heuristic, and every read error means denied, never allowed."
    source: "ADR-073 (consequences: fail-closed privacy)"
    owner: backend/app/services/transcript_chat.py
    applies_to: ["backend/app/services/transcript_chat.py", "backend/app/services/token_harvester.py"]
    enforced_by:
      - {test: "backend/tests/test_transcript_chat_sessions.py::test_transcript_allowed_boss_unreadable_file_denied"}
      - {test: "backend/tests/test_transcript_chat_sessions.py::test_transcript_allowed_non_boss_host_agent_fails_closed"}
      - {test: "backend/tests/test_transcript_chat_sessions.py::test_transcript_allowed_boss_private_cwd_denied"}
    status: active
    checked: 2026-10-01

  - id: R-chat-sender-identity-carried-or-degraded
    says: "Sender identity travels as a value through the neutral chat pipeline; a channel without identity capability degrades it visibly (prefix) instead of dropping who spoke."
    source: "ADR-072 section 2 (sender identity)"
    owner: backend/app/services/chat_outbound.py
    applies_to: ["backend/app/services/chat_adapter.py", "backend/app/services/chat_outbound.py", "backend/app/services/chat_*.py"]
    enforced_by:
      - {test: "backend/tests/test_chat_adapter_tck.py::test_sender_identity_is_carried_or_visibly_degraded"}
    status: active
    checked: 2026-10-01

  - id: R-group-mention-storm-guard
    says: "On group threads only mention-targeted messages are delivered, and an agent post without mentions wakes nobody — storm protection is structural, not throttled."
    source: "ADR-075 (decision; addendum PR B)"
    owner: backend/app/services/thread_scope.py
    applies_to: ["backend/app/services/thread_scope.py", "backend/app/services/group_service.py", "backend/app/routers/agents.py"]
    enforced_by:
      - {test: "backend/tests/test_group_agent_post.py::test_agent_post_without_mentions_wakes_nobody"}
      - {test: "backend/tests/test_group_delivery.py::test_unmentioned_group_message_pushes_nobody"}
    status: active
    checked: 2026-10-01

  - id: R-stale-messages-do-not-wake
    says: "A stale thread message never wakes an agent: system notices expire after agent_message_stale_after_seconds, old peer-agent messages are withheld only while the task is finished or the thread closed (back on reopen), operator messages never expire; never-deliverable leading messages are acked server-side."
    source: "Inbox-nudge live finding 2026-10-09; ADR-071 (pull delivery)"
    owner: backend/app/routers/agents.py
    applies_to: ["backend/app/routers/agents.py", "backend/app/services/thread_scope.py"]
    enforced_by:
      - {test: "backend/tests/test_stale_inbox_nudges.py::test_week_old_system_notice_in_dm_does_not_nudge"}
      - {test: "backend/tests/test_stale_inbox_nudges.py::test_old_operator_message_in_dm_still_nudges"}
      - {test: "backend/tests/test_stale_inbox_nudges.py::test_catch_up_stops_at_the_first_deliverable_message"}
      - {test: "backend/tests/test_stale_inbox_nudges.py::test_reopened_card_still_delivers_old_unseen_peer_message"}
    status: active
    checked: 2026-10-09

  - id: R-slot-row-exclusions
    says: "A slot runtime row is never a recipe instance, box occupancy, eviction victim or autostart/recovery target; only the drift watcher always follows it."
    source: "ADR-078 decision 3 (exclusions wherever is_slot)"
    owner: backend/app/services/slot_runtimes.py
    applies_to: ["backend/app/services/slot_runtimes.py", "backend/app/services/recipe_switcher.py", "backend/app/services/runtime_manager.py", "backend/app/services/runtime_watcher.py"]
    enforced_by:
      - {test: "backend/tests/test_slot_runtime_core.py::test_slot_row_never_matches_a_recipe"}
      - {test: "backend/tests/test_slot_runtime_core.py::test_slot_row_is_never_an_occupancy"}
      - {test: "backend/tests/test_slot_runtime_core.py::test_slot_row_is_never_evicted"}
      - {test: "backend/tests/test_slot_runtime_core.py::test_slot_row_is_never_auto_recovered"}
    status: active
    checked: 2026-10-01

  - id: R-active-content-downloads
    says: "Active content (HTML/SVG/XML/JS) is served from every files root only as an attachment download with a neutral content type, never inline with its own MIME."
    source: "ADR-074 (consequences, negative: security change in read_stream)"
    owner: backend/app/services/fs_service.py
    applies_to: ["backend/app/services/fs_service.py"]
    enforced_by:
      - {test: "backend/tests/test_fs_service.py::test_read_stream_forces_download_for_active_content"}
      - {test: "backend/tests/test_fs_service.py::test_active_content_is_never_served_with_its_own_mime"}
    status: active
    checked: 2026-10-01


  # From ADRs 080-087 (night rule-register run, reviewed 2026-10-01).
  - id: R-acp-harness-property
    says: "Whether an omp agent runs the ACP driver follows from its harness, never from an agent-name list; a new *_agent_slugs settings field needs an explicit whitelist entry in the guard test."
    source: "ADR-084 decision 1 and guard 6 (supersedes ADR-081)"
    owner: backend/app/services/harness_compat.py
    applies_to: ["backend/app/services/harness_compat.py", "backend/app/services/compose_renderer.py"]
    enforced_by:
      - {test: "backend/tests/test_acp_harness_property.py::test_no_slug_list_identifiers_in_backend_code"}
      - {test: "backend/tests/test_acp_harness_property.py::test_settings_has_no_new_agent_slug_fields"}
      - {test: "backend/tests/test_acp_harness_property.py::test_driver_decision_takes_a_harness_not_a_slug"}
    status: active
    checked: 2026-10-01

  - id: R-heartbeat-control-channel
    says: "The heartbeat response is the control channel for a running turn: stop or a foreign blocker is a hard interrupt, an unread foreign blocker comment a soft one, and the agent's own comments never interrupt it."
    source: "ADR-080 (decision)"
    owner: backend/app/routers/agents.py
    applies_to: ["backend/app/routers/agents.py", "docker/omp-bridge/**"]
    enforced_by:
      - {test: "backend/tests/test_heartbeat_control.py::test_heartbeat_hard_on_run_control_stopped"}
      - {test: "backend/tests/test_heartbeat_control.py::test_heartbeat_hard_on_foreign_block"}
      - {test: "backend/tests/test_heartbeat_control.py::test_heartbeat_hard_beats_soft"}
      - {test: "backend/tests/test_heartbeat_control.py::test_heartbeat_own_block_does_not_interrupt"}
    status: active
    checked: 2026-10-01

  - id: R-no-hex-alpha-concat
    says: "A colour is never made translucent by appending a hex alpha suffix; alpha() is the only way."
    source: "ADR-087 decision 6 (colour rules for both modes)"
    owner: frontend-v2/src/lib/colors.ts
    applies_to: ["frontend-v2/src/**"]
    enforced_by:
      - {test: "frontend-v2/src/lib/__tests__/no-hex-alpha-concat.test.ts::no source file appends a hex alpha suffix to a colour — use alpha()"}
    status: active
    checked: 2026-10-01

  - id: R-theme-switch-data-theme-only
    says: "data-theme on <html> is the only theme switch; no dark class on <html>, no Tailwind dark: variant, no .dark selector."
    source: "ADR-087 decision 6 (colour rules for both modes)"
    owner: frontend-v2/src/lib/theme.ts
    applies_to: ["frontend-v2/src/**"]
    enforced_by:
      - {test: "frontend-v2/src/lib/__tests__/no-dark-class.test.ts::the root layout does not put a static dark class on <html>"}
      - {test: "frontend-v2/src/lib/__tests__/no-dark-class.test.ts::no source file uses the Tailwind dark: variant"}
      - {test: "frontend-v2/src/lib/__tests__/no-dark-class.test.ts::globals.css defines no .dark selector or dark custom variant"}
    status: active
    checked: 2026-10-01

  - id: R-voice-config-no-keys
    says: "The voice config endpoint answers with provider, model, voice and slug only — never key material — and a missing or invalid binding fails soft so the voice worker never goes silent."
    source: "ADR-082 decision 3"
    owner: backend/app/services/voice_runtime.py
    applies_to: ["backend/app/routers/agent_scoped.py", "backend/app/services/voice_runtime.py"]
    enforced_by:
      - {test: "backend/tests/test_agent_voice_config_endpoint.py::test_response_never_carries_key_material"}
      - {test: "backend/tests/test_agent_voice_config_endpoint.py::test_unbound_agent_falls_back_calmly"}
    status: active
    checked: 2026-10-01

  - id: R-ssh-host-key-pinned
    says: "SSH to a registered box checks its host key: learned on first use, a changed key is refused until an admin trusts exactly that key; the system ssh never runs with StrictHostKeyChecking=no."
    source: "SECURITY-FINDINGS.md (SSH host-key check)"
    owner: backend/app/services/ssh_host_keys.py
    applies_to: ["backend/app/services/ssh_host_keys.py", "backend/app/services/runtime_manager.py", "backend/app/services/host_onboarding.py", "backend/app/services/agent_bootstrap.py", "backend/app/routers/cli_terminal.py"]
    enforced_by:
      - {test: "backend/tests/test_ssh_host_key_tofu.py::test_first_connection_stores_host_key_and_logs_event"}
      - {test: "backend/tests/test_ssh_host_key_tofu.py::test_swapped_key_is_refused_before_any_command"}
      - {test: "backend/tests/test_ssh_host_key_tofu.py::test_retrust_accepts_exactly_the_refused_key"}
      - {test: "backend/tests/test_ssh_host_key_tofu.py::test_no_system_ssh_path_disables_host_key_checking"}
    status: active
    checked: 2026-10-16

  - id: R-proof-gate-finish
    says: "An agent's move to review/done on a card with a PR is checked on the server with evidence it fetches itself: the PR exists, is open (done: open or merged), is this card's PR, a reported SHA is the pushed head, the required CI checks are green, the PR really changed after the last change request (against the head the server recorded), review->done is closed by someone other than the developer with his own verdict, PR URLs quoted in the agent's comments exist. warn = card comment + task.proof_gate warning event, enforce = 422; no request field skips it; the date flip waits for PROOF_GATE_ENFORCE_MIN_CHECKS checked moves."
    source: "Beweis-Tor (team measure 2026-10-19: false finish reports were found by hand)"
    owner: backend/app/services/proof_gate.py
