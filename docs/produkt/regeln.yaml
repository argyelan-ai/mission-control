  - id: R-stop-only-own-run
    says: "A task card offers Stop run only for a run that is provably its own: the agent's current_task_id names the card, or the bridge's live run record (run_task_id on the agent read, from acp-task-state.json) names it. A busy agent with an empty pointer is no proof — with two review cards delivered, Stop on card B used to end run A. The stop API holds the same line: a review card that is not the agent's run gets 409, and stopping any card sets the agent idle only when it does not provably run a different card."
    source: "round-4 user tests K5 (r1 N2); K5 review SHOULD-2"
    owner: frontend-v2/src/components/task/TaskActions.tsx
    applies_to: ["frontend-v2/src/components/task/TaskActions.tsx", "backend/app/routers/agents.py", "backend/app/services/acp_chat_transport.py", "backend/app/services/operations.py"]
