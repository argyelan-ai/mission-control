  - id: R-lead-usage-only-from-lead-dir
    says: "Host Claude Code usage is booked on the lead agent only when the transcript lives in the lead's own project dir (the Claude Code encoding of its working dir, MC_CHECKOUT_PATH / token_harvester.lead_checkout_path). Every other MC-looking transcript under the host's ~/.claude/projects is the operator's own usage (agent_id NULL, harness operator-session) and shows as its own cost bucket; private ones are skipped. The harvester, the Sessions chat and the usage baseline read the lead dir from that one helper."
