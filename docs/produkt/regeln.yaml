  - id: R-chat-never-works-own-run
    says: "A call from an agent's chat session (X-MC-Session-Role: chat) never writes the run state of a task a run of that agent holds (assigned and live, or delivered; for a reviewer the review_handoff card in review, without a time limit) or let go of within 30 minutes: run-state comments, status, deliverables, checklist, recover, a blocking ask, and question/help/delegate (they set the run's task to blocked) and review verdicts (mc review / mc review-note) are refused with 409; reading, a plain question, mc msg and a reply (message comment) stay open (the reply not on the card the agent's review run works), and so do tasks no run holds. The reply goes by task id (mc comment message … --task-id <id>; the chat has no task env): the board-agnostic comment route takes a chat reply with tasks:write, everything else there stays tasks:manage. The context block and the chat's comment wake-up name that reply, and the block names per review card who decides it (the operator with its two buttons, the agent's own review run, or a reviewer agent's run). A chat reply or chat mc msg never ACKs a delivered task; the reply is stored as chat_reply, the chat's thread messages (mc msg, a plain mc ask) carry Message.from_chat, and no watchdog counts either as the run's sign of life (silent card, silent mailbox, stale check, stuck check). Every other reader of a card's activity or the run's latest word skips chat_reply through the one list comment_types.NOT_ACTIVITY_COMMENT_TYPES (activity_comment_filter()): the task list's last activity, the daily digest's stale cards, the reviewer/Lead-reacted checks, the builder a rework goes back to, failure reasons and agent metrics; the UI labels it Chat reply / Chat-Antwort in the timeline and the comments tab. One timeline row per task and action per 10 minutes. The omp chat turn is told what the run is doing instead, on the operator's clock, in plain status words, as a snapshot (as of HH:MM)."
    source: "docs/specs/chat-over-acp.md (The chat never works its agent's own task)"
    owner: backend/app/services/chat_session_guard.py
    applies_to: ["backend/app/services/chat_session_guard.py", "backend/app/services/chat_run_context.py", "backend/app/routers/agent_comments.py", "backend/app/routers/agent_task_status.py", "backend/app/routers/agent_scoped.py", "backend/app/routers/agents.py", "backend/app/services/task_evidence.py", "backend/app/comment_types.py", "backend/app/services/messaging.py", "backend/app/services/task_runner.py", "backend/app/routers/tasks.py", "backend/app/services/daily_metrics_digest.py", "backend/app/models/thread.py", "docker/omp-bridge/acp_chat.py", "scripts/mc-cli/mc_cli/client.py", "scripts/mc-cli/mc_cli/commands.py", "docker/omp-bridge/bridge.py"]
