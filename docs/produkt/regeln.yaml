  - id: R-runtime-window-one-source
    says: "The bound runtime's context window has one source (runtime_window.runtime_context_window): every OpenAI-protocol harness is told it (MC_CONTEXT_WINDOW, omp also OMP_CONTEXT_WINDOW; Hermes via model.context_length), and the omp-format chat shows it over a harness-reported window that disagrees. Two harnesses on one runtime never show two different windows. The agent row's context_max follows the same window on every heartbeat (agent_shown_window), so the agent page and the chat divide by one number; vendor-window harnesses (Claude Code, Grok, Kimi) keep their own."
    source: "ADR-086 (harness x runtime cross-switch); ADR-064 (host model sync)"
    owner: backend/app/services/runtime_window.py
    applies_to: ["backend/app/services/runtime_window.py", "backend/app/routers/internal.py", "backend/app/services/omp_chat.py", "scripts/hermes-config-patch.py", "scripts/hermes-bridge.py", "backend/app/routers/agents.py"]
