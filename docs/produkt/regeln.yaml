  - id: R-mask-no-length-no-password
    says: "A masked secret never shows its length: always a fixed run of dots. One field rule serves the credentials Vault and the API-key list: a name that, NFKC-folded, lower-cased with separators and camelCase folded, contains pass/pw/phrase/kennwort/pin/secret/seed/private/otp or content never shows a tail; only token/key-like names keep the last 4 characters, and only for 20+ characters; every other name gets the fixed run. A nested value (dict/list) is hidden in full. Only the public name github_owner is shown in full."
    source: "ADR-098 (amended round-4 K5); round-3 user tests (t4 S4); round-4 r1 N1"
    owner: backend/app/services/encryption.py
