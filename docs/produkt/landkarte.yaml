# Product map (Roter Faden). Written by hand, read by `kz`. See README.md here.
# Stage E3b: endpoints (later tables) are mapped round by round; whatever is
# not mapped yet still sits in luecken-basis.json as the E3b work list.
# `source` says which doc a status comes from; `note: unconfirmed` means no
# doc states the page's status yet (default `active`, to be confirmed in E3b).
version: 1

journeys:
  - id: J-job-to-merge
    job: "When I have a coding job, I want to hand it to a short-lived head and later merge a checked PR."
    source: "ADR-085 decision 1; ROADMAP E1b"
    steps:
      - {feature: F-tasks}   # new task -> "Run as head" -> status, stop, result (PR + run record) on the task detail
    end_state: "PR open with a run record; the operator merges through the merge queue"
    test: e2e/journeys/J-job-to-merge.spec.ts

  - id: J-phone-needs-you
    job: "When something waits for me, I want to see and answer it from my phone in a few taps."
    source: "PRINCIPLES 7.1 (needs you = open approvals + blocked/user_test tasks), 7.10 (phone)"
    steps:
      - {feature: F-home}    # what waits, last night's report
      - {feature: F-inbox}   # open approvals
      - {feature: F-tasks}   # tasks and heads that need an answer
    end_state: "Nothing waits for the operator"
    test: e2e/journeys/J-phone-needs-you.spec.ts

  - id: J-runtime-switch
    job: "When a model or harness is busy, weak or down, I want to run the job on another harness x runtime pair."
    source: "ADR-086 decisions 1-3; ROADMAP E1b"
    steps:
      - {feature: F-runtimes}  # which runtime is busy
      - {feature: F-tasks}     # pick a pair from the matrix, "restart with ..." another pair
    end_state: "The same job continues on the new pair"
    test: e2e/journeys/J-runtime-switch.spec.ts

features:
  - id: F-home
    name: "Home: what needs me, last night's report"
    ui: {route: /}
    api:
      # Activity feed and live stream on Home (ActivityHistoryPanel,
      # SystemHealthSection, useActivityStream); the agent detail page also
      # reads the activity list. Last night's night-shift report card.
      - "GET /api/v1/activity"
      - "GET /api/v1/activity/stream"
      - "* /api/v1/night-shift/last-night"
      - "* /api/v1/night-shift/last-night/*"
      - "GET /api/v1/system/daily-metrics"   # daily metrics digest M1-M5 on Home (E0, MC first)
    status: active
    source: "PRINCIPLES 7.1; ROADMAP E2 (morning report on the Home card)"
  - id: F-tasks
    name: "Tasks: create, run as head, follow and finish work"
    ui: {route: /tasks}
    api:
      # Boards are the task workspace: the shell board picker (BoardPicker)
      # switches boards, the tasks page and task detail use everything under
      # /boards/{board}/tasks (list, detail, reorder, checklist, comments,
      # deliverables, dependencies, events, git, hierarchy, timeline,
      # workspace, dispatch/promote/resume/review/stop). scripts/mc-mcp.py
      # and scripts/demo-seed.py use the same task endpoints.
      - "* /api/v1/boards"
      - "* /api/v1/boards/{board_id}"
      - "* /api/v1/boards/*/snapshot"
      - "* /api/v1/boards/*/tasks"
      - "* /api/v1/boards/*/tasks/reorder"
      - "* /api/v1/boards/*/tasks/pipeline"
      - "* /api/v1/boards/*/tasks/{task_id}"
      - "* /api/v1/boards/*/tasks/{task_id}/checklist"
      - "* /api/v1/boards/*/tasks/{task_id}/comments"
      - "* /api/v1/boards/*/tasks/{task_id}/dependencies"
      - "* /api/v1/boards/*/tasks/{task_id}/deliverables"
      - "* /api/v1/boards/*/tasks/{task_id}/deliverables/{deliverable_id}/*"
      - "* /api/v1/boards/*/tasks/{task_id}/dispatch"
      - "* /api/v1/boards/*/tasks/{task_id}/events"
      - "* /api/v1/boards/*/tasks/{task_id}/git-diff"
      - "* /api/v1/boards/*/tasks/{task_id}/git-info"
      - "* /api/v1/boards/*/tasks/{task_id}/hierarchy"
      - "* /api/v1/boards/*/tasks/{task_id}/promote"
      - "* /api/v1/boards/*/tasks/{task_id}/resume"
      - "* /api/v1/boards/*/tasks/{task_id}/review"
      - "* /api/v1/boards/*/tasks/{task_id}/stop"
      - "* /api/v1/boards/*/tasks/{task_id}/timeline"
      - "* /api/v1/boards/*/tasks/{task_id}/workspace/*"
      # Projects and phases on a board (tasks page project grouping,
      # TaskFormFields, task detail); tags on tasks/projects.
      - "* /api/v1/boards/*/projects*"
      - "GET /api/v1/projects/{project_id}/phases"
      - "* /api/v1/tags"
      - "* /api/v1/tags/{tag_id}"
      - "* /api/v1/projects/*/tags"
      - "* /api/v1/projects/*/tags/*"
      # Heads (ADR-085): "run as head" from the task form (pairs, start),
      # live head state, log, run record, restart and stop on the task
      # detail. The runtimes cockpit also reads the head list (orphan runs).
      - "* /api/v1/heads"
      - "* /api/v1/heads/pairs"
      - "* /api/v1/heads/{run_id}"
      - "* /api/v1/heads/{run_id}/*"
      # Night shift (ROADMAP E2): mark/unmark a task for tonight
      # (CreateTaskModal, task list "tonight" column).
      - "* /api/v1/night-shift/tonight"
      - "* /api/v1/night-shift/tasks/{task_id}"
      # User-side chat thread, transcript and run record on the task detail
      # (ThreadPanel, TaskTranscript, TaskSummaryTab).
      - "* /api/v1/tasks/{task_id}/thread*"
      - "GET /api/v1/tasks/{task_id}/transcript"
      - "* /api/v1/tasks/{task_id}/run-record*"
    status: active
    source: "ROADMAP E1b, UI waves 2 and 3a"
  - id: F-inbox
    name: "Inbox: open approvals"
    ui: {route: /inbox}
    api:
      # Open approvals list and resolve (inbox page, MobileNav badge,
      # useApprovalStream live reload; the task detail resolves too).
      - "* /api/v1/approvals"
      - "* /api/v1/approvals/{approval_id}"
      - "GET /api/v1/approvals/stream"
    status: active
    source: "ROADMAP UI wave 2 (pages that stay)"
  - id: F-runtimes
    name: "Runtimes: engines, which one is busy"
    ui: {route: /runtimes}
    status: active
    source: "ADR-086; ROADMAP UI waves 0c and 2; E1 switch lock (a switch is refused while the engine works)"
    api:
      # Head occupancy / orphan runs in the stage cockpit and runtimes page
      # (ADR-086: which pair is busy).
      - "GET /api/v1/heads/occupancy"
      # Runtimes page (beyond head occupancy): engine register, fleet stage
      # and box cockpit, box/onboarding wizard, LM Studio models and
      # downloads, runtime schedules, vLLM discovery, model catalog
      # (ModelCatalogSection) and the local recipe registry
      # (LocalModelBrowser). ADR-056: the harness x runtime compat matrix
      # also feeds the switch modal on the task detail and the agent wizard;
      # GET /runtimes/spark/metrics is a back-compat alias (ADR-048) with no
      # component caller; db/{slug}/agents feeds the cockpit agent list.
      - "* /api/v1/runtimes"
      - "* /api/v1/runtimes/*"
      # Host registry and device control: HostsSection, BoxWizard,
      # HostOnboardDialog, NodePairingDialog, stage telemetry (metrics,
      # pulse, metrics/history), recipe switcher and autostart — all
      # mounted on the runtimes page.
      - "* /api/v1/hosts"
      - "* /api/v1/hosts/*"
      # Curated local-recipe registry: list/refresh/enable in
      # LocalModelBrowser and the box wizard; install + install log in
      # SshProcessDeployDialog. Starts go through POST /hosts/{id}/recipes/…,
      # not through this router.
      - "* /api/v1/local-registry"
      - "* /api/v1/local-registry/*"
      # Node devices (Fleet & Rezepte v2): pairing-code mint
      # (NodePairingDialog), device tiles with desired-state control
      # (DeviceControl). The node agent itself polls pair/heartbeat/
      # agent-script (see internal); inventory and single device-state GET
      # have no page caller today (onboarding reads the DB directly).
      - "POST /api/v1/nodes/pairing-codes"
      - "GET /api/v1/nodes/devices"
      - "GET /api/v1/nodes/{host_id}/device-state"
      - "GET /api/v1/nodes/{host_id}/inventory"
      - "PUT /api/v1/nodes/{host_id}/device-state"
      # Provider model catalog (ModelCatalogSection on the runtimes page;
      # bind() creates a runtime row, the switch modal itself is unchanged).
      - "* /api/v1/models/catalog"
      - "* /api/v1/models/catalog/*"
  - id: F-settings
    name: "Settings"
    ui: {route: /settings}
    status: active
    source: "ROADMAP UI wave 2; E2 (night-shift window)"
    api:
      # Night-shift window config (NightShiftTab, ROADMAP E2).
      - "* /api/v1/night-shift/config"
      # AI provider settings + HuggingFace/embeddings connection tests
      # (AiProvidersTab).
      - "* /api/v1/ai-providers/*"
      # Model cost prices CRUD, unmatched list and cost recompute
      # (CostPricesTab).
      - "* /api/v1/model-prices"
      - "* /api/v1/model-prices/*"
  - id: F-memory
    name: "Memory: the vault"
    ui: {route: [/memory, /memory/graph]}
    status: active
    source: "ADR-085 section 2 (vault stays); ROADMAP UI wave 2"
    api:
      # Board memory CRUD (LegacyMemoryPage); memory list also feeds the
      # task detail context.
      - "* /api/v1/boards/*/memory"
      - "* /api/v1/boards/*/memory/{memory_id}"
  - id: F-schedule
    name: "Schedule: planned jobs"
    ui: {route: [/schedule, "/schedule/[jobId]"]}
    status: active
    source: "ROADMAP UI wave 2"
  - id: F-insights
    name: "Insights: usage and metrics"
    ui: {route: /insights}
    # E0 measuring layer: token baseline per week x source, page-usage beacon
    api: ["GET /api/v1/intelligence/costs/by-week", "POST /api/v1/usage/page", "GET /api/v1/usage/pages"]
    status: active
    source: "ADR-085 section 2 (metrics stay); ROADMAP UI wave 4; ROADMAP E0 (baseline table)"
  - id: F-sessions
    name: "Sessions chat"
    ui: {route: /sessions}
    api:
      # Slices of the /api/v1/agents API the Sessions UI calls (ChatView,
      # Composer, DiffPanel, AgentCard; terminal remount signal). The rest of
      # /api/v1/agents/* is claimed by F-agents below.
      - "* /api/v1/agents/*/chat/*"
      - "* /api/v1/agents/*/terminal-events/stream"
    status: frozen
    source: "ADR-085 section 4 (build stop); ROADMAP: candidate for removal"
  - id: F-loops
    name: "Loops"
    ui: {route: /loops}
    status: frozen
    source: "ADR-085 (ADR-051 frozen); ROADMAP: candidate for removal"
  - id: F-office
    name: "Office"
    ui: {route: /office}
    status: frozen
    source: "ROADMAP UI waves: candidate for removal; PRINCIPLES 7.12 (no polish)"
  - id: F-agents
    name: "Agents"
    ui: {route: [/agents, "/agents/[id]"]}
    api:
      # Fleet management API of the agents pages and wizard: list/create,
      # detail, lifecycle (start/stop/restart/archive/restore/reset), config,
      # skills, plugins, MCP, metrics, provision, local memory, SSE stream.
      # The chat and terminal slices are also used by F-sessions (listed there).
      # Review note: GET /agents/runtime-status and POST /agents/{id}/reset-token
      # have no page caller (tests / manual operator use only). GET
      # /agents/{id}/metrics(/summary) has a client helper but no caller
      # (the runtimes cockpit reads /hosts/{id}/metrics instead).
      - "* /api/v1/agents"
      - "* /api/v1/agents/*"
      # Wizard: template list/create, edit, instantiate.
      - "* /api/v1/agent-templates"
      - "* /api/v1/agent-templates/*"
      # Host agent start/stop/restart buttons on the agent detail page.
      - "* /api/v1/host-agents/*"
      # Agent wizard model list (wizard/shared.tsx). The single-model read
      # has a client helper (api.models.get) but no caller today; the model
      # CATALOG endpoints belong to the runtimes page (listed there).
      - "GET /api/v1/models"
      - "GET /api/v1/models/{model_id}"
    note: unconfirmed
  - id: F-bench
    name: "Benchmark studio"
    ui: {route: /bench}
    note: unconfirmed
  - id: F-files
    name: "Files browser"
    ui: {route: /files}
    note: unconfirmed
  - id: F-repos
    name: "Repos registry"
    ui: {route: /repos}
    note: unconfirmed
    api:
      # Repos registry: list/import/register/create, sync, link to project,
      # GitHub status and config (settings page reuses github-status/config).
      - "* /api/v1/repos"
      - "* /api/v1/repos/*"
  - id: F-skills
    name: "Skills"
    ui: {route: /skills}
    note: unconfirmed
  - id: F-login
    name: "Login"
    ui: {route: /login}
    status: internal
    source: "ADR-085 section 2 (auth is cross-cutting core)"
  - id: F-setup
    name: "First-run wizard"
    ui: {route: /setup}
    status: internal
    source: "shown once after the first registration"

internal:
  # Agent-scoped machine API (ADR-009: separate from the user router).
  # Agents poll tasks, heartbeat, report, comment, delegate and read
  # vault/knowledge here — callers: mc CLI (scripts/mc-cli), bridges
  # (scripts/*-bridge.py), agent templates (backend/templates), host poll
  # scripts. The global voice overlay reuses the agent-scoped
  # /api/v1/agent/me/telegram endpoint (no page of its own; voice decision
  # pending, ROADMAP stop 3). No bare /api/v1/agent endpoint exists.
  - "endpoint:* /api/v1/agent/*"
  # Deprecated guided playbook setup (no UI caller since Workstream C1).
  - "endpoint:GET /api/v1/playbooks/guided/current"
  - "endpoint:POST /api/v1/playbooks/guided/sessions/start"
  - "endpoint:POST /api/v1/playbooks/guided/sessions/{session_id}/message"
  # Approval quick-resolve links: the backend embeds these URLs in Telegram
  # and approval messages; the phone browser opens them directly (no page in
  # frontend-v2 calls them).
  - "endpoint:GET /api/v1/approvals/{approval_id}/quick-resolve"
  - "endpoint:POST /api/v1/approvals/{approval_id}/quick-resolve/confirm"
  # Board-scoped approval list: client helper exists (api.approvals.boardList)
  # but no page calls it; the inbox reads the unscoped list.
  - "endpoint:* /api/v1/boards/*/approvals"
  # SSE streams without a page caller today (helpers exist in the frontend
  # sseUrls map; docs/handbook/operations/reverse-proxy.md proxies them).
  - "endpoint:GET /api/v1/boards/{board_id}/tasks/stream"
  - "endpoint:GET /api/v1/boards/{board_id}/memory/stream"
  # Board groups: client helpers and a store field exist, but no page or
  # script calls the API (the board picker reads boards directly).
  - "endpoint:* /api/v1/board-groups*"
  # Project/phase machine API: mc-mcp reads a project and completes phases
  # (scripts/mc-mcp.py); phase create/edit/remove have no caller yet.
  - "endpoint:GET /api/v1/projects/{project_id}"
  - "endpoint:POST /api/v1/projects/{project_id}/phases"
  - "endpoint:* /api/v1/projects/{project_id}/phases/{phase_id}"
  - "endpoint:POST /api/v1/projects/{project_id}/phases/{phase_id}/complete"
  # Task usage rollup and single checklist item delete: no caller found (the
  # CLI uses the agent-scoped /agent/... checklist route).
  - "endpoint:GET /api/v1/tasks/{task_id}/usage"
  - "endpoint:DELETE /api/v1/boards/{board_id}/tasks/{task_id}/checklist/{item_id}"
  # Node-agent machine API (scripts/node-agent/mc-node-agent.py, "Fleet &
  # Rezepte v2" phase 1): the box trades a one-shot pairing code for a node
  # token, then pushes telemetry heartbeats; the install one-liner curls the
  # agent script (unauthenticated on purpose — no secrets in the file).
  - "endpoint:POST /api/v1/nodes/pair"
  - "endpoint:POST /api/v1/nodes/heartbeat"
  - "endpoint:GET /api/v1/nodes/agent-script"
  # Deploy router user endpoints (backend/app/routers/deploy.py, "for
  # Dashboard"): no page or script calls them today. The agent-scoped deploy
  # endpoints live under /api/v1/agent/* (covered above, ADR-009).
  - "endpoint:GET /api/v1/deploy/services"
  - "endpoint:GET /api/v1/deploy/history"
