# Journey-test stack (E6, docs/journeys.md). Throw-away and isolated from a
# running MC install on the same machine:
#   - own compose project (the runner always passes -p mc-journeys),
#   - own image names: docker-compose.yml builds into the published tag
#     (ghcr.io/…:latest), so building from it would overwrite the images the
#     live stack runs,
#   - no ~/.mc mount (HOME_HOST points at an empty scratch home), no docker
#     socket, no SSH keys, no channel or provider tokens,
#   - background services off (scheduler, Slack/Telegram, runtime watcher,
#     heads) — the API process answers requests only,
#   - one port, bound to localhost: MC_JOURNEYS_PORT (default 18080).
# Only e2e/run-journeys.sh starts it; it generates the env file with fresh
# secrets and tears everything down with `down -v` afterwards.
name: mc-journeys

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run through e2e/run-journeys.sh}
      POSTGRES_DB: mission_control
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels: [mc-journeys=1]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?run through e2e/run-journeys.sh} --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels: [mc-journeys=1]

  backend:
    image: mc-journeys-backend:nightly
    build:
      context: ../../backend
      labels: [mc-journeys=1]
    init: true
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      ENABLE_BACKGROUND_SERVICES: "false"
      SLACK_REPORTS_ENABLED: "false"
      SLACK_APPROVALS_ENABLED: "false"
      RUNTIME_WATCHER_ENABLED: "false"
      HEADS_ENABLED: "false"
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mc:${DB_PASSWORD}@db:5432/mission_control
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN:?}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?}
      INTERNAL_BOOTSTRAP_SECRET: ${INTERNAL_BOOTSTRAP_SECRET:?}
      HOME_HOST: /journeys-home
      MC_REPO_PATH: /nonexistent
      MC_BASE_URL: http://localhost:${MC_JOURNEYS_PORT:-18080}
      OPERATOR_NAME: Operator
    volumes:
      - ${MC_JOURNEYS_HOME:?}:/journeys-home
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 36
    labels: [mc-journeys=1]

  frontend:
    image: mc-journeys-frontend:nightly
    build:
      context: ../../frontend-v2
      labels: [mc-journeys=1]
    depends_on:
      backend: {condition: service_healthy}
    environment:
      NEXT_PUBLIC_API_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 24
    labels: [mc-journeys=1]

  caddy:
    image: caddy:2-alpine
    depends_on: [frontend, backend]
    ports:
      - "127.0.0.1:${MC_JOURNEYS_PORT:-18080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    labels: [mc-journeys=1]
