name: Guards

# Lessons as code: every guard in tools/guards must turn its .bad fixtures red
# and keep its .good fixtures green, and its logic must be what does it.
# The lint step then runs the guards on the files agents actually follow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    name: Guards (fixtures + sabotage probe + repo lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: shellcheck
        run: shellcheck -S warning tools/guards/*.sh
      # Each check runs even when an earlier one failed, so a red run shows every finding.
      - name: Every .bad is red, every .good is green
        if: always()
        run: bash tools/guards/run-all.sh
      - name: Sabotage probe — commenting out a guard's logic must break its fixtures
        if: always()
        run: bash tools/guards/sabotage-probe.sh
      - name: Lint the files agents follow (scripts, hooks, docs, AGENTS.md)
        if: always()
        run: bash tools/guards/lint.sh AGENTS.md CLAUDE.md docs scripts tools .github
      - name: Hook installer keeps foreign hooks and stays idempotent
        if: always()
        run: python3 -m unittest tools/guards/tests/test_install_hooks.py
