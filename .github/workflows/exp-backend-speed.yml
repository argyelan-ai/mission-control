name: EXP backend speed (temporary, removed before merge)
on:
  push:
    branches: [ci/backend-tests-faster]
  workflow_dispatch:
jobs:
  exp:
    name: exp new-config rep=${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: CPU
        run: lscpu | grep "Model name"
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
          UV_COMPILE_BYTECODE: "1"
        run: |
          python -m pip install uv==0.11.2
          uv pip install -r requirements.lock
          uv pip install --no-deps -e .
      - name: Collect cold
        run: /usr/bin/time -f "COLLECT-COLD %e s" pytest --collect-only -q -p no:cacheprovider | tail -1
      - name: compileall
        run: /usr/bin/time -f "COMPILEALL %e s" python -m compileall -q -j 4 app tests ../jarvis_core > /dev/null
      - name: Collect warm
        run: /usr/bin/time -f "COLLECT-WARM %e s" pytest --collect-only -q -p no:cacheprovider | tail -1
      - name: Run tests
        run: pytest -x --tb=short -q -n auto --dist worksteal --durations=0 --durations-min=0.05
