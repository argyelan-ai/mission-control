name: EXP backend speed (temporary, removed before merge)
on:
  push:
    branches: [ci/backend-tests-faster]
  workflow_dispatch:
jobs:
  exp:
    name: exp n=${{ matrix.n }} dist=${{ matrix.dist }} rep=${{ matrix.rep }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [4, 8]
        dist: [load, worksteal]
        rep: [1, 2]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: CPU
        run: nproc; lscpu | grep -E "Model name|^CPU\(s\)"; free -g
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Run tests
        run: /usr/bin/time -v pytest -x --tb=short -q -n ${{ matrix.n }} --dist ${{ matrix.dist }} --durations=40 2>&1 | tail -120
