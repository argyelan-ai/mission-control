name: Release Images

# Baut + pusht die offiziellen Images nach GHCR, damit Nutzer pullen statt
# lokal bauen (Install-Zeit ~10min -> ~1min, halbe Fehlerklasse weg).
# Laeuft NUR im oeffentlichen Repo: im privaten Dev-Repo haette GITHUB_TOKEN
# keine Schreibrechte auf ghcr.io/argyelan-ai/* und jeder Tag-Push waere rot.
#
# Three stages, so a broken or unapproved image can never land under a tag
# users pull (ADR-094 decision 5):
#   1. images  — build + push each image ONLY as sha-<commit>, then verify it
#                (both architectures; mc-backend contains app/worker.py).
#   2. sign    — waits for a maintainer's approval (environment `release`,
#                required reviewer), refuses to run when that environment is
#                not protected, then signs every verified image BY DIGEST with
#                cosign keyless. The signature says: built by this repo's
#                release.yml, on a push of this tag, at this commit.
#   3. promote — re-tags exactly the signed digests (no rebuild) with
#                `docker buildx imagetools create` to X.Y.Z, and for a stable
#                tag also X.Y + latest (scripts/release-image-tags.sh, tested),
#                then runs the update engine's own verifier against X.Y.Z.
# A manual run (workflow_dispatch) stops after stage 1: sha-<commit> only,
# unsigned. Setup of the environment and the tag rule: docs/setup/releasing.md.
# Publish the GitHub release only after this workflow is green — see
# docs/setup/releasing.md; install.sh additionally skips a release whose
# images are not there yet.

on:
  push:
    # Strict release tags only (GitHub filter patterns match the whole name):
    # vX.Y.Z and pre-releases vX.Y.Z-<suffix>. A loose tag like v0.5
    # triggers nothing.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

jobs:
  images:
    if: github.repository == 'argyelan-ai/mission-control'
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: mc-backend
            context: ./backend
          - image: mc-frontend
            context: ./frontend-v2
          # Agent images: shared sources (mc-cli, poll.sh, recycler-lib.sh)
          # must be materialized into the context first — same step the local
          # build script runs. CLI versions come from docker/cli-versions.json.
          # omp/kimi are NOT published: their binaries are pinned arm64-only.
          - image: mc-claude-agent
            context: ./docker/mc-claude-agent
            agent_prep: true
          - image: mc-agent-base
            context: ./docker/mc-agent-base
            agent_prep: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Materialize shared agent sources
        if: matrix.agent_prep == true
        run: ./scripts/build-agent-images.sh --sync-only

      # Plattenplatz-Preflight vor jedem Image-Build dieses Matrix-Jobs.
      #
      # Warum ein eigener Step und nicht im Build selbst:
      # docker/build-push-action ist eine Action, kein Shell-Skript — die
      # Karte verlangt den Preflight aber in JEDEM Bau-Weg, und dieser Job ist
      # einer (hier entstehen die veroeffentlichten Images). Die Lib wird
      # gesourct und direkt aufgerufen; `mc_disk_preflight` gibt 1 zurueck und
      # bricht den Step damit rot ab. Die Cache-Begrenzung folgt am Ende des
      # Jobs.
      - name: Disk preflight
        # BUILD_MIN_FREE_GB=5: hosted Runner haben ~14 GB frei, die lokale
        # 15-GB-Schwelle wuerde den Release-Bau garantiert und falsch
        # verweigern. Kein Job-weites env — diese Workflow hat keinen
        # Lib-Test-Step, aber die Bindung an den Build-Step bleibt richtig.
        env:
          BUILD_MIN_FREE_GB: "5"
        run: |
          . ./docker/shared/disk-preflight.sh
          mc_disk_preflight

      - name: Read pinned CLI versions
        if: matrix.agent_prep == true
        id: cliversions
        run: |
          echo "claude=$(python3 -c 'import json;print(json.load(open("docker/cli-versions.json"))["claude"]["version"])')" >> "$GITHUB_OUTPUT"
          echo "openclaude=$(python3 -c 'import json;print(json.load(open("docker/cli-versions.json"))["openclaude"]["version"])')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/argyelan-ai/${{ matrix.image }}
          # Stage 1 pushes ONLY the commit tag. Release tags (X.Y.Z, X.Y,
          # latest) are set by the promote job after every image verified.
          tags: |
            type=sha,format=long,prefix=sha-

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          # arm64 fuer Mac-/Pi-Self-Hoster, amd64 fuer den Rest.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Unused args are ignored by images whose Dockerfile doesn't declare
          # them — only the agent images consume these.
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            CLAUDE_VERSION=${{ steps.cliversions.outputs.claude }}
            OPENCLAUDE_VERSION=${{ steps.cliversions.outputs.openclaude }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Proof, not trust: the pushed manifest really carries both
      # architectures (a Pi or an Apple-silicon Mac pulls arm64), and the
      # backend image — which also runs mc-worker (`python -m app.worker`,
      # same image in docker-compose.yml) — really contains the worker
      # module on both. A release whose worker module is missing is exactly
      # the endless crash this check exists for.
      - name: Verify published architectures (+ worker module in mc-backend)
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IS_BACKEND: ${{ matrix.image == 'mc-backend' }}
        run: |
          set -euo pipefail
          plats="$(docker buildx imagetools inspect "$IMAGE" | sed -n 's/^ *Platform: *//p' | sort -u)"
          echo "$IMAGE:"; echo "$plats"
          for p in linux/amd64 linux/arm64; do
            grep -qx "$p" <<<"$plats" || { echo "::error::$IMAGE lacks $p"; exit 1; }
          done
          if [ "$IS_BACKEND" = true ]; then
            for p in linux/amd64 linux/arm64; do
              docker run --rm --platform "$p" --entrypoint test "$IMAGE" -f /app/app/worker.py \
                || { echo "::error::$IMAGE ($p) has no app/worker.py — mc-worker would crash-loop"; exit 1; }
            done
          fi

      # Cache begrenzen — nur nach einem erfolgreichen Push (ein Fehlschlag
      # oben bricht den Job vorher ab, der Layer-Cache bleibt fuer den Retry).
      # Der Runner ist fluechtig; dieser Step existiert, damit der Bau-Weg
      # dieselbe Nachbehandlung hat wie jeder lokale Weg, nicht weil hier ein
      # Laufzeit-Cache zu retten waere.
      - name: Bound the build cache
        run: |
          . ./docker/shared/disk-preflight.sh
          mc_build_cache_cleanup

  sign:
    # Between verify and promote: nothing is signed or promoted before a
    # maintainer approved this run, and only images that passed stage 1.
    needs: images
    if: github.repository == 'argyelan-ai/mission-control' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Approve and sign verified images
    runs-on: ubuntu-latest
    # Required reviewer = the approval click. GitHub would create a missing
    # environment on the fly WITHOUT protection — the first step below
    # stops the job in that case.
    environment: release
    permissions:
      contents: read
      actions: read     # read the environment's protection rules
      packages: write   # cosign stores the signature next to the image
      id-token: write   # keyless: this job's OIDC identity is what gets signed
    outputs:
      digests: ${{ steps.sign.outputs.digests }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Release gate — environment must require a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate_check.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Same version as the verifier the engine runs (COSIGN_VERSION in
          # scripts/mc_update_verify.py; a test keeps the two equal).
          cosign-release: v3.1.3
      - name: Sign each verified image by digest
        id: sign
        run: |
          set -euo pipefail
          digests='{}'
          for image in mc-backend mc-frontend mc-claude-agent mc-agent-base; do
            src="ghcr.io/argyelan-ai/$image:sha-$GITHUB_SHA"
            digest="$(docker buildx imagetools inspect "$src" --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $src"; exit 1; }
            ref="ghcr.io/argyelan-ai/$image@$digest"
            echo "signing $ref"
            cosign sign --yes "$ref"
            digests="$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); d[sys.argv[2]]=sys.argv[3]; print(json.dumps(d))' "$digests" "$image" "$digest")"
          done
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  promote:
    # Only after every image verified (stage 1) AND was approved and signed
    # (stage 2) — otherwise a verified frontend could be promoted next to an
    # unverified backend and `latest` would mix versions.
    needs: sign
    if: github.repository == 'argyelan-ai/mission-control' && startsWith(github.ref, 'refs/tags/v')
    name: Promote signed images to release tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the signed digests as X.Y.Z (+ X.Y, latest for stable tags)
        env:
          DIGESTS: ${{ needs.sign.outputs.digests }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(bash scripts/release-image-tags.sh "$GITHUB_REF")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::$GITHUB_REF is not a release tag — nothing to promote"; exit 1
          fi
          echo "promoting $GITHUB_SHA to: ${tags[*]}"
          for image in mc-backend mc-frontend mc-claude-agent mc-agent-base; do
            # The digest the sign job signed — not sha-<commit> again, which
            # could have moved in between.
            digest="$(python3 -c 'import json,os,sys; print(json.loads(os.environ["DIGESTS"])[sys.argv[1]])' "$image")"
            src="ghcr.io/argyelan-ai/$image@$digest"
            args=()
            for t in "${tags[@]}"; do args+=(-t "ghcr.io/argyelan-ai/$image:$t"); done
            docker buildx imagetools create "${args[@]}" "$src"
          done
      - name: The update engine accepts this release's signatures
        # Same verifier, same pinned cosign container as on a user's machine
        # (scripts/mc_update_verify.py). If what CI signs and what the engine
        # checks ever drift apart, the release goes red here — before anyone
        # publishes it. Pre-releases are never offered by the engine: skipped.
        env:
          DIGESTS: ${{ needs.sign.outputs.digests }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pre-release $GITHUB_REF_NAME: the engine never installs it, nothing to prove"; exit 0
          fi
          out="$(python3 scripts/mc_update_verify.py signature "$GITHUB_REF_NAME" --commit "$GITHUB_SHA")" \
            || { echo "::error::engine refuses $GITHUB_REF_NAME: $out"; exit 1; }
          echo "$out"
          OUT="$out" python3 -c '
          import json, os, sys
          got = json.loads(os.environ["OUT"])["images"]
          want = json.loads(os.environ["DIGESTS"])
          bad = [n for n, i in got.items() if i["digest"] != want.get(n)]
          if bad:
              sys.exit("::error::X.Y.Z does not resolve to the signed digest for: " + ", ".join(bad))
          print("engine verification ok:", ", ".join(sorted(got)))
          '
