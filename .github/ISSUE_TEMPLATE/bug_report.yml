name: Bug report
description: Something broke
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: os-arch
    attributes:
      label: OS / arch
      placeholder: e.g. macOS 15 / arm64, Ubuntu 24.04 / amd64
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: Deployment
      description: Fresh `setup.sh` install? Upgraded from which commit/release?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        `docker compose logs backend --tail=100` — remove tokens/secrets
        first.
      render: shell
    validations:
      required: false
