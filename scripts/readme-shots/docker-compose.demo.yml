# Isolated demo stack for the README screenshots — NOT a way to run MC.
#
# Separate on purpose from docker-compose.yml: that file pins the network name
# `mission-control_default`, mounts ~/.mc and talks to the Docker socket. A
# second stack built from it would join (and could control) a running
# install. This one has its own project name, network and volumes, no Docker
# access, no worker, no agents, no voice/browser services.
#
# Use through ./demo-stack.sh (it writes the throwaway secrets file).
name: mc-demo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run demo-stack.sh}
      POSTGRES_DB: mission_control
    volumes:
      - demo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?run demo-stack.sh}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: mc-demo-backend:demo
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ENVIRONMENT: production
      # API only: no scheduler, watchdog, recovery or dispatch loop.
      ENABLE_BACKGROUND_SERVICES: "false"
      DATABASE_URL: postgresql+asyncpg://mc:${DB_PASSWORD}@db:5432/mission_control
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_MODE: local
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      INTERNAL_BOOTSTRAP_SECRET: ${INTERNAL_BOOTSTRAP_SECRET}
      OPERATOR_NAME: Operator
      # No Docker daemon reachable: the demo can neither see nor touch any
      # container on this machine.
      DOCKER_HOST: tcp://127.0.0.1:1
      HOME_HOST: /home/mcuser
      MC_AGENTS_ROOT: /home/mcuser/.mc/agents
      MC_REPO_PATH: /home/mcuser/mc
      SPARK_LLM_URL: http://192.0.2.10:8000/v1
      HEADS_ENABLED: "false"
      NIGHT_SHIFT_ENABLED: "false"
      VOICE_LIVE_ENABLED: "false"
      MC_SKIP_MIGRATIONS: "0"
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-18000}:8000"
      # The frontend shares this network namespace (see below).
      - "127.0.0.1:${DEMO_WEB_PORT:-13000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 40

  frontend:
    image: mc-demo-frontend:demo
    # The production build proxies /api/* to localhost:8000; sharing the
    # backend's network namespace makes that the demo backend — no Caddy.
    network_mode: "service:backend"
    depends_on:
      backend: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_URL: ""

volumes:
  demo_pg:
